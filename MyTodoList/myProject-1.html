<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="myProject-1.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <title>MyToDoList</title>
</head>

<body>
    <div class="container">
        <div class="container-card">
            <!-- TÍTULO COM GATO -->
            <div class="title-container">
                <h1>
                    <svg width="100%" height="55" viewBox="0 0 400 55" preserveAspectRatio="xMidYMid meet">
                        <text x="50%" y="42" font-size="38" font-family="Orbitron, sans-serif" font-weight="700"
                            fill="none" stroke="#fff" stroke-dasharray="13 2" text-anchor="middle"
                            dominant-baseline="middle">TODO LIST</text>
                    </svg>
                </h1>
                
                <!-- GATO ANIMADO -->
                <svg class="cat-icon" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Corpo -->
                    <ellipse cx="100" cy="140" rx="50" ry="35" fill="#4a4a4a"/>
                    <!-- Cabeça -->
                    <circle cx="100" cy="90" r="40" fill="#4a4a4a"/>
                    <!-- Orelhas -->
                    <polygon points="70,60 60,20 85,50" fill="#4a4a4a"/>
                    <polygon points="130,60 140,20 115,50" fill="#4a4a4a"/>
                    <!-- Orelhas internas -->
                    <polygon points="72,58 65,28 83,52" fill="#ff8a80"/>
                    <polygon points="128,58 135,28 117,52" fill="#ff8a80"/>
                    <!-- Olhos -->
                    <ellipse cx="85" cy="85" rx="10" ry="12" fill="#2e7d32"/>
                    <ellipse cx="115" cy="85" rx="10" ry="12" fill="#2e7d32"/>
                    <!-- Pupilas -->
                    <ellipse cx="85" cy="85" rx="4" ry="8" fill="#000"/>
                    <ellipse cx="115" cy="85" rx="4" ry="8" fill="#000"/>
                    <!-- Brilho nos olhos -->
                    <circle cx="88" cy="80" r="3" fill="white" opacity="0.8"/>
                    <circle cx="118" cy="80" r="3" fill="white" opacity="0.8"/>
                    <!-- Nariz -->
                    <polygon points="97,95 103,95 100,100" fill="#ff8a80"/>
                    <!-- Bigodes -->
                    <line x1="65" y1="95" x2="85" y2="97" stroke="#666" stroke-width="1.5"/>
                    <line x1="65" y1="100" x2="85" y2="100" stroke="#666" stroke-width="1.5"/>
                    <line x1="65" y1="105" x2="85" y2="103" stroke="#666" stroke-width="1.5"/>
                    <line x1="135" y1="95" x2="115" y2="97" stroke="#666" stroke-width="1.5"/>
                    <line x1="135" y1="100" x2="115" y2="100" stroke="#666" stroke-width="1.5"/>
                    <line x1="135" y1="105" x2="115" y2="103" stroke="#666" stroke-width="1.5"/>
                    <!-- Boca -->
                    <path d="M95,103 Q100,110 105,103" fill="none" stroke="#666" stroke-width="1.5"/>
                    <!-- Patas -->
                    <ellipse cx="75" cy="172" rx="12" ry="8" fill="#4a4a4a"/>
                    <ellipse cx="125" cy="172" rx="12" ry="8" fill="#4a4a4a"/>
                    <!-- Rabo -->
                    <path d="M145,150 Q165,140 160,120 Q155,105 165,100" fill="none" stroke="#4a4a4a" stroke-width="6" stroke-linecap="round"/>
                    <!-- Patas dianteiras -->
                    <ellipse cx="85" cy="175" rx="8" ry="5" fill="#4a4a4a"/>
                    <ellipse cx="115" cy="175" rx="8" ry="5" fill="#4a4a4a"/>
                </svg>
            </div>

            <hr>

            <div class="inputTask">
                <input type="text" class="addItem" placeholder="Adicione uma tarefa..." maxlength="50">
                <button type="button" class="btnADD">Adicionar</button>
            </div>

            <div class="taskListContainer" id="taskListContainer">
                <div class="empty-message"> Nenhuma tarefa por aqui...</div>
            </div>

            <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none">
                <defs>
                    <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
                </defs>
                <g class="parallax">
                    <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(124, 58, 237, 0.4)" />
                    <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(139, 92, 246, 0.3)" />
                    <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.2)" />
                    <use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(255,255,255,0.1)" />
                </g>
            </svg>
        </div>
    </div>

    <script src="MyJSProject-1.js"></script>
</body>

</html>
